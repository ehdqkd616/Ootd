name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ===== Node.js 서비스 =====
  node-lint-typecheck:
    name: Node.js Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

  node-build:
    name: Node.js Build
    runs-on: ubuntu-latest
    needs: node-lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Build
        run: pnpm build

  # ===== Python 서비스 =====
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Lint AI Orchestration
        run: ruff check services/ai-orchestration/

      - name: Lint Recommendation
        run: ruff check services/recommendation/

      - name: Lint Avatar
        run: ruff check services/avatar/

  # ===== Docker Build =====
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [node-build, python-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - { name: auth, context: services/auth }
          - { name: wardrobe, context: services/wardrobe }
          - { name: outfit, context: services/outfit }
          - { name: ai-orchestration, context: services/ai-orchestration }
          - { name: recommendation, context: services/recommendation }
          - { name: avatar, context: services/avatar }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.context }}/Dockerfile
          push: false
          tags: ootd/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
