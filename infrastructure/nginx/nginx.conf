events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Docker 내장 DNS — 변수로 proxy_pass 하면 기동 시 업스트림이 없어도 nginx가 뜨고,
  # 컨테이너 재생성으로 IP가 바뀌어도 따라간다.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    # 이미지가 base64로 JSON 본문에 실려 오기 때문에 넉넉하게
    client_max_body_size 25M;

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    set $auth_service     http://auth-service:3001;
    set $wardrobe_service http://wardrobe-service:3002;
    set $outfit_service   http://outfit-service:3003;
    set $ai_orchestration http://ai-orchestration:8001;

    # 라우팅은 apps/web/vite.config.ts 의 dev 프록시와 동일하게 유지

    # Auth Service (로그인 + 회원 승인 관리)
    location /api/v1/auth {
      proxy_pass $auth_service;
    }

    location /api/v1/admin {
      proxy_pass $auth_service;
    }

    # Wardrobe Service (옷장 + 아바타)
    location /api/v1/wardrobe {
      proxy_pass $wardrobe_service;
    }

    location /api/v1/avatars {
      proxy_pass $wardrobe_service;
      proxy_read_timeout 180s;
    }

    # Outfit Service (코디, 작업 상태, 추천)
    location /api/v1/outfits {
      proxy_pass $outfit_service;
      proxy_read_timeout 180s;
    }

    location /api/v1/jobs {
      proxy_pass $outfit_service;
    }

    location /api/v1/recommendations {
      proxy_pass $outfit_service;
      proxy_read_timeout 120s;
    }

    # WebSocket for job notifications
    location /ws {
      proxy_pass $outfit_service;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    # AI Orchestration (docker compose --profile ai 로 띄웠을 때만 응답)
    location /api/v1/process {
      proxy_pass $ai_orchestration;
      proxy_read_timeout 120s;
    }

    # Health checks
    location = /health {
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # Web (SPA)
    location /assets/ {
      root /usr/share/nginx/html;
      expires 1y;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      expires -1;
    }
  }
}
