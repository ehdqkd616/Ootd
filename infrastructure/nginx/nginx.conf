events {
  worker_connections 1024;
}

http {
  upstream auth_service {
    server auth-service:3001;
  }

  upstream wardrobe_service {
    server wardrobe-service:3002;
  }

  upstream outfit_service {
    server outfit-service:3003;
  }

  upstream ai_orchestration {
    server ai-orchestration:8001;
  }

  upstream recommendation {
    server recommendation:8002;
  }

  upstream avatar_service {
    server avatar-service:8003;
  }

  server {
    listen 80;

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Auth Service
    location /api/v1/auth/ {
      proxy_pass http://auth_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Wardrobe Service
    location /api/v1/wardrobe/ {
      proxy_pass http://wardrobe_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      client_max_body_size 25M;
    }

    # Outfit Service
    location /api/v1/outfits/ {
      proxy_pass http://outfit_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/jobs/ {
      proxy_pass http://outfit_service;
      proxy_set_header Host $host;
    }

    # WebSocket for job notifications
    location /ws {
      proxy_pass http://outfit_service;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    # AI Orchestration
    location /api/v1/process/ {
      proxy_pass http://ai_orchestration;
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
    }

    # Recommendation Service
    location /api/v1/recommendations/ {
      proxy_pass http://recommendation;
      proxy_set_header Host $host;
      proxy_read_timeout 60s;
    }

    # Avatar Service
    location /api/v1/avatars/generate {
      proxy_pass http://avatar_service;
      proxy_set_header Host $host;
      client_max_body_size 25M;
      proxy_read_timeout 120s;
    }

    # Health checks
    location /health {
      return 200 '{"status":"ok"}';
      add_header Content-Type application/json;
    }
  }
}
